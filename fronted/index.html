<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>PingPulse - API & Web Health Monitor</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="container">
    <header>
      <h1>⚡ PingPulse</h1>
      <p>Live Website & API Health Monitor</p>
    </header>

    <main>
      <form id="checkForm">
        <label class="visually-hidden" for="urlInput">Website or API URL</label>
        <input
          type="text"
          id="urlInput"
          placeholder="e.g. google.com or github.com/explore"
          autocomplete="url"
          required
        />
        <button type="submit" id="submitBtn">Check Health</button>
      </form>
      <div class="controls-row">
        <label class="auto-refresh-control" for="autoRefresh">
          <input type="checkbox" id="autoRefresh">
          <span>Auto-refresh every 30s</span>
        </label>
      </div>
      <section id="recentSearches" class="recent-searches hidden" aria-label="Recent searches">
        <h2>Recent searches</h2>
        <div id="recentSearchChips" class="recent-search-chips"></div>
      </section>
      <p id="inputError" class="error-message hidden" role="alert"></p>

      <div id="resultCard" class="card hidden">
        <div class="card-header">
          <span id="targetUrl"></span>
          <span id="statusBadge" class="badge"></span>
        </div>
        <div class="card-body">
          <p><strong>HTTP Status Code:</strong> <span id="statusCode">-</span></p>
          <p><strong>Response Time:</strong> <span id="responseTime">-</span> ms</p>
          <p><strong>Last Checked:</strong> <span id="checkTime">-</span></p>
          <section class="ssl-details" aria-label="SSL certificate details">
            <h2>SSL certificate</h2>
            <p><strong>Security:</strong> <span id="sslBadge" class="ssl-badge">-</span></p>
            <p><strong>Expires in:</strong> <span id="sslExpiresInDays">-</span></p>
            <p><strong>Issuer:</strong> <span id="sslIssuer">-</span></p>
            <p id="sslError" class="ssl-error hidden" role="status"></p>
          </section>
          <section class="status-history" aria-label="Recent check history">
            <h2>Recent check history</h2>
            <div id="statusHistoryTicker" class="status-history-ticker" role="list"></div>
          </section>
        </div>
      </div>

      <section class="monitors-panel" aria-labelledby="monitorsHeading">
        <div class="section-heading">
          <div>
            <h2 id="monitorsHeading">Monitors</h2>
            <p>Keep an eye on your important endpoints.</p>
          </div>
        </div>
        <form id="monitorAuthForm" class="monitor-auth-form">
          <label for="monitorAccessKey">Monitor access key</label>
          <div class="monitor-auth-controls">
            <input type="password" id="monitorAccessKey" autocomplete="current-password" required>
            <button type="submit" id="unlockMonitorsBtn">Unlock monitors</button>
          </div>
          <p id="monitorAuthMessage" class="monitor-message hidden" role="alert"></p>
        </form>
        <div id="monitorContent" hidden>
          <form id="monitorForm" class="monitor-form">
            <label>
              <span>Monitor name</span>
              <input type="text" id="monitorName" maxlength="120" required placeholder="Production website">
            </label>
            <label>
              <span>URL</span>
              <input type="url" id="monitorUrl" maxlength="2048" required placeholder="https://example.com">
            </label>
            <label>
              <span>Check interval</span>
              <select id="monitorInterval">
                <option value="1">Every minute</option>
                <option value="5" selected>Every 5 minutes</option>
                <option value="10">Every 10 minutes</option>
                <option value="15">Every 15 minutes</option>
                <option value="30">Every 30 minutes</option>
                <option value="60">Every hour</option>
              </select>
            </label>
            <button type="submit" id="addMonitorBtn">Add monitor</button>
          </form>
          <p id="monitorMessage" class="monitor-message hidden" role="status"></p>
          <div id="monitorList" class="monitor-list" aria-live="polite"></div>
        </div>
      </section>
    </main>
  </div>

  <script type="module" src="app.js"></script>
</body>
</html>
